# 每月检查一次依赖更新，每类合并成一个 PR，由 CI 验证
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # 只有开发依赖（commander 也在其中）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # commander 打包进产物，14 起要求 Node 20+，会打破 engines 声明的 Node >= 18.17
      - dependency-name: commander
        versions: [">=14"]
      # 类型版本不跟着最新 Node 走，避免用到最低支持版本里没有的 API
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
